# MySQL + Redis + S3-compatible storage for local development and tests. Django tests create a test_coursemap DB on the same MySQL server.
# Redis is only the Celery broker (results are stored in MySQL's PlanJob table).
# s3: target for plan exports. The official MinIO images can no longer be pulled, so this uses RustFS, an S3-compatible server.
#   The access keys are local development values for this container only (same as the MySQL password). Never put real AWS keys here.
#   Create the bucket: .venv/bin/python manage.py ensure_s3_bucket
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: coursemap
      MYSQL_USER: coursemap
      MYSQL_PASSWORD: coursemap
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: "${S3_ACCESS_KEY_ID:-coursemap-dev}"
      RUSTFS_SECRET_KEY: "${S3_SECRET_ACCESS_KEY:-coursemap-dev-secret}"
    ports:
      - "${S3_PORT:-9000}:9000"
    volumes:
      - s3-data:/data

volumes:
  mysql-data:
  s3-data:
